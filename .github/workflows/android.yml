name: Android build

# Debug APK on every push to main and on demand; signed release APK + AAB
# when the signing secrets are configured (see docs/BUILD_ANDROID.md):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_ALIAS, ANDROID_KEYSTORE_PASSWORD
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

env:
  GODOT_VERSION: "4.7.1"

jobs:
  android:
    name: Export Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;35.0.0 platforms;android-35"

      - name: Cache Godot + export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-android-${{ env.GODOT_VERSION }}

      - name: Install Godot and Android export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && rm godot.zip
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T"
          unzip -q -j templates.tpz templates/android_debug.apk templates/android_release.apk templates/android_source.zip templates/version.txt -d "$T"
          rm templates.tpz

      - name: Configure Godot editor settings
        run: |
          echo "$HOME/godot" >> "$GITHUB_PATH"
          export PATH="$HOME/godot:$PATH"
          godot --headless --path . --import || true
          SETTINGS=$(ls ~/.config/godot/editor_settings-4*.tres | head -n1)
          sed -i '/^export\/android\/android_sdk_path/d;/^export\/android\/java_sdk_path/d' "$SETTINGS"
          echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\"" >> "$SETTINGS"
          echo "export/android/java_sdk_path = \"$JAVA_HOME\"" >> "$SETTINGS"
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Export debug APK
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/InfiniteLoopAscension-debug.apk
          ls -la build/android

      - name: Export signed release APK and AAB
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.keystore"
          godot --headless --path . --export-release "Android" build/android/InfiniteLoopAscension-release.apk
          godot --headless --path . --install-android-build-template --export-release "Android AAB" build/android/InfiniteLoopAscension-release.aab
          rm -f "$RUNNER_TEMP/release.keystore"
          ls -la build/android

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            build/android/*.apk
            build/android/*.aab
          if-no-files-found: error
